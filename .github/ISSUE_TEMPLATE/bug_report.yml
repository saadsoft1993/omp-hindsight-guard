name: Bug report
description: Something does not work as the README says it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not paste real keys, tokens, bank key files or memory contents. If a secret got
        past the redactor, or one bank can reach another, do not file it here: use the repository's Security tab instead.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `omp-hindsight-guard --version`.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      description: Output of `python3 --version` for the Python that runs the tool.
      placeholder: "3.12.4"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and shell
      placeholder: "macOS 15 arm64, zsh; Ubuntu 24.04 x86_64, bash"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Proxy
        - Redaction
        - Banks and folder mapping (hooks, overlays)
        - Importer
        - Doctor
        - Backup and health scripts
        - Install or documentation
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest input or configuration that shows the problem. Build any secret-looking value in the same shape; never use a real one.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Command output (for example `omp-hindsight-guard doctor`). Remove anything private first.
      render: text
