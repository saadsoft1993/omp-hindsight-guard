[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omp-hindsight-guard"
version = "0.1.3"
description = "Redacting proxy, per-folder memory banks and importer for a self-run Hindsight server used with omp"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Saad bin Abid" }]
keywords = ["omp", "hindsight", "memory", "redaction", "proxy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]
# PyYAML reads the per-bank settings overlays (importer --send, doctor). The code fails loudly and names the
# package if it is missing, so a broken environment is never mistaken for an empty one.
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
omp-hindsight-guard = "omp_hindsight_guard.cli:main"
omp-hindsight-guard-pick = "omp_hindsight_guard.hookpick:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
omp_hindsight_guard = ["hooks/*", "scripts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["tools"]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF"]
ignore = [
    "B904", # raise inside except without from
    "E402", # module level import not at top of file
    "E501", # line too long
    "W191", # indentation contains tabs
    "RUF001", # string contains ambiguous unicode character
]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
